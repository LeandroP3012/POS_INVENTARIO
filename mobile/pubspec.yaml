name: pos_mobile
description: App móvil para Sistema POS - T-Gestiona
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  http: ^1.2.1
  dio: ^5.4.3

  # Estado
  provider: ^6.1.2

  # Almacenamiento local (token JWT)
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1

  # Íconos
  material_design_icons_flutter: ^7.0.7296

  # Internacionalización / fechas
  intl: any

  # Gráficos para reportes
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
